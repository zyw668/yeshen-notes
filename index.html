<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夜神笔记</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- CDN 引入第三方库：marked 把 Markdown 转 HTML，highlight.js 给代码上色 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <!-- Supabase 客户端（数据库 + 登录 + 实时） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="./index.html">🌙 夜神笔记</a>
      <span class="nav-main" id="navMain"></span>
      <span class="nav-right" id="navAuth"></span>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">全部笔记</h1>

    <!-- 工具栏：搜索框 + 分类筛选 -->
    <div class="toolbar">
      <input class="search-box" id="searchInput" type="text" placeholder="搜索标题或内容…">
      <div class="category-chips" id="categoryChips"></div>
    </div>

    <!-- 笔记卡片网格（由 list.js 动态填充） -->
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty" id="emptyTip" style="display:none;">没有找到匹配的笔记</div>
  </main>

  <!-- 脚本按依赖顺序加载：数据 → 存储层 → 公共工具 → 当前页逻辑 -->
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/list.js"></script>
</body>
</html>
