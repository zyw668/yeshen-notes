<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记详情 - 夜神笔记</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="./index.html">🌙 夜神笔记</a>
      <span class="nav-main" id="navMain"></span>
      <span class="nav-right" id="navAuth"></span>
    </div>
  </nav>

  <main class="container">
    <div class="detail-layout">
      <!-- 左侧：文章正文 -->
      <article class="article">
        <header class="article-header">
          <div class="article-meta" id="articleMeta"></div>
          <h1 id="articleTitle" style="font-size:28px;"></h1>
        </header>
        <div class="markdown" id="articleContent"></div>
      </article>

      <!-- 右侧：目录（由 note.js 生成） -->
      <aside class="toc" id="toc"></aside>
    </div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/note.js"></script>
</body>
</html>
